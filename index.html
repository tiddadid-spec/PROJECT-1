<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101322" />
  <title>Hello, world!</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101322;
      color: #f7f5ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 20%, rgba(111, 76, 255, .20), transparent 38%),
        radial-gradient(ellipse at 82% 78%, rgba(34, 211, 238, .13), transparent 38%),
        #101322;
    }

    .glow {
      position: fixed;
      width: 28rem;
      height: 28rem;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .2;
      pointer-events: none;
    }
    .glow.one { top: -15rem; right: -7rem; background: #9b7bff; }
    .glow.two { bottom: -18rem; left: -7rem; background: #22d3ee; }

    main {
      position: relative;
      width: min(92vw, 760px);
      padding: clamp(2.5rem, 8vw, 5.5rem) clamp(1.5rem, 7vw, 5rem);
      text-align: center;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 32px;
      background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.025));
      box-shadow: 0 30px 100px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.12);
      backdrop-filter: blur(18px);
      animation: arrive .8s cubic-bezier(.2,.8,.2,1) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin-bottom: 1.6rem;
      padding: .55rem .9rem;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      color: #c9c3e8;
      background: rgba(255,255,255,.045);
      font-size: .75rem;
      font-weight: 650;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .spark { color: #f8c96b; font-size: 1rem; }

    h1 {
      margin: 0;
      font-size: clamp(3.3rem, 10vw, 6.8rem);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 780;
    }
    h1 span {
      display: block;
      padding: .08em 0 .16em;
      color: transparent;
      background: linear-gradient(100deg, #c4b5fd 5%, #f0abfc 48%, #67e8f9 95%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    p {
      max-width: 34rem;
      margin: 1.6rem auto 0;
      color: #aaa9bd;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.75;
    }

    .rule {
      width: 4rem;
      height: 3px;
      margin: 2.2rem auto 0;
      border-radius: 9px;
      background: linear-gradient(90deg, #a78bfa, #67e8f9);
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      color: rgba(223,220,241,.45);
      font-size: .75rem;
      letter-spacing: .08em;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(18px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="glow one" aria-hidden="true"></div>
  <div class="glow two" aria-hidden="true"></div>
  <main>
    <div class="eyebrow"><span class="spark" aria-hidden="true">✦</span> A little beginning</div>
    <h1>Hello,<span>world!</span></h1>
    <p>Every great idea starts somewhere. Here’s to the first line, the next big thing, and everything you’ll make along the way.</p>
    <div class="rule" aria-hidden="true"></div>
  </main>
  <footer>MADE FOR WHAT COMES NEXT</footer>
</body>
</html>
